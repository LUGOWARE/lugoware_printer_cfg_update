# ########===========================HW1_M5P_MULTISET============================########
# ########============================== MCU 설정 ===============================########
# DO NOT ERASE #######

[include mainsail.cfg]  # Mainsail 설정 파일 포함
[include timelapse.cfg]

[mcu CB2]  # 가상 MCU (Klipper host MCU)
serial: /tmp/klipper_host_mcu

[mcu]  # 메인 보드 MCU 설정
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_LUGOLABS-if00

[virtual_sdcard]  # 가상 SD 카드 디렉토리 경로
path: /home/biqu/printer_data/gcodes






# ########===========================HW1_M5P_MULTISET============================########
# FLEX4_W_V1.5(기존온도센서)
# 히팅프로세스 수정
# 도킹 파킹 로직 수정
# 시간표시 M73 추가
# ########============================= 프린터 설정 ==============================########

[printer]  # 프린터의 전반적인 동작 설정
kinematics: cartesian  # 카르테시안 프린터 구조 사용
max_velocity: 1100  # 최대 XY 이동 속도 (mm/s)
max_accel: 16000  # 최대 가속도 (mm/s^2)
minimum_cruise_ratio: 0.0
max_z_velocity: 40  # Z축 최대 속도
max_z_accel: 500  # Z축 최대 가속도
square_corner_velocity: 9  # 모서리 감속 설정 (속도 유지 최소값)

[gcode_macro M73]
rename_existing: M73.1
gcode:
  M73.1 P{params.P|default(0)|int} R{params.R|default(0)|int}
  {% set p = params.P|default(0)|int %}
  M117 {p}%

# ########============================== 모터 구동부 ==============================########

[stepper_x]  # X축 스텝 모터 설정
step_pin: PB0  # 스텝 신호 핀
dir_pin: PB1  # 방향 신호 핀
enable_pin: !PC4  # 모터 드라이버 활성화 핀 (반전)
microsteps: 16  # 마이크로스텝 
rotation_distance: 40  # 1회 회전 시 이동 거리 (mm)
full_steps_per_rotation: 200   # 모터 1회 회전 시 스텝 수
endstop_pin: ^PD3  # X축 엔드스탑 핀 (풀업)
position_min: -2  # X 최소 위치
position_endstop: 0  # 엔드스탑 감지 시 위치
position_max: 381  # X 최대 위치
homing_speed: 100  # 홈 속도 (mm/s)
homing_retract_dist: 2  # 리트랙트 거리
homing_positive_dir: false  # 음(-) 방향으로 홈 이동
step_pulse_duration: 0.000002  # 펄스 시간 (정밀 제어용)

[stepper_y]  # Y축 스텝 모터 설정
step_pin: PB12
dir_pin: !PB11
enable_pin: !PA8
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PD2
position_min: -2
position_endstop: 255
position_max: 257
homing_speed: 100
homing_retract_dist: 2
homing_positive_dir: true  # 양(+) 방향으로 홈 이동
step_pulse_duration: 0.000002

[stepper_z]  # Z축 스텝 모터 설정
step_pin: PC6
dir_pin: PC7
enable_pin: !PA9
microsteps: 16
endstop_pin: probe:z_virtual_endstop  # Z 프로브로 가상 엔드스탑
rotation_distance: 10  # 기본 회전 거리
full_steps_per_rotation: 200
gear_ratio: 2:1  # 감속 기어 적용 (더 정밀하게)
position_min: -4  # 빌드 플레이트 아래까지 허용
position_max: 375  # 최대 Z 높이
homing_speed: 10
homing_retract_dist: 0.5
second_homing_speed: 2
step_pulse_duration: 0.000002

[thermistor custom_stepped_offset] 
temperature1: 45
resistance1: 34572
temperature2: 160
resistance2: 747
temperature3: 245
resistance3: 155

[multi_pin dual_hotend_heater]
pins: PC5, PA7

[extruder]  # 익스트루더 모터 및 히터 설정
step_pin: PA10
dir_pin: !PA14
enable_pin: !PA13
microsteps: 16
rotation_distance: 7  # 필라멘트 1회 회전 시 이동 거리
gear_ratio: 1:1
full_steps_per_rotation: 200
nozzle_diameter: 0.400  # 노즐 지름
filament_diameter: 1.750  # 필라멘트 지름
min_temp: -10  # 최소 온도
max_temp: 350 # 최대 온도
min_extrude_temp: 0
heater_pin: multi_pin:dual_hotend_heater # PC5 # 히터 제어 핀
#sensor_type: NTC 100K MGB18-104F39050L32  # 써미스터 타입
sensor_type: custom_stepped_offset
sensor_pin: PA1  # 온도 센서 핀
max_power: 1.0  # 히터 최대 전력 (0~1)
control = pid
pid_kp = 24.053
pid_ki = 1.932
pid_kd = 74.864
pressure_advance: 0.039  # 압력 보정 계수
pressure_advance_smooth_time: 0.045  # 압력 보정 부드러움
max_extrude_cross_section: 50  # 최대 압출 면적 (mm^2)
instantaneous_corner_velocity: 2.5  # 코너 속도
max_extrude_only_distance: 500  # 최대 압출 거리
max_extrude_only_velocity: 100  # 최대 압출 속도
max_extrude_only_accel: 4000  # 최대 압출 가속도
step_pulse_duration: 0.000004  # 펄스 길이

# ########============================= 드라이버 설정 ============================########

[tmc5160 stepper_x]
cs_pin: PA6
spi_software_sclk_pin: PB13
spi_software_mosi_pin: PB15
spi_software_miso_pin: PB14
run_current: 3.5
hold_current: 1.75
sense_resistor: 0.033
stealthchop_threshold: 999999
driver_PWM_AUTOSCALE: true
driver_PWM_AUTOGRAD: true
driver_PWM_OFS: 30
driver_PWM_GRAD: 4

[tmc5160 stepper_y]
cs_pin: PB2
spi_software_sclk_pin: PB13
spi_software_mosi_pin: PB15
spi_software_miso_pin: PB14
run_current: 2.0
hold_current: 1.1
sense_resistor: 0.033
stealthchop_threshold: 999999
driver_PWM_AUTOSCALE: True
driver_PWM_AUTOGRAD: True
driver_PWM_OFS: 30
driver_PWM_GRAD: 4

[tmc2209 stepper_z]  # Z축 모터용 TMC2209 드라이버 설정
uart_pin: PB10
run_current: 1.8
hold_current: 0.8
interpolate: True
stealthchop_threshold: 0

[tmc2209 extruder]  # 익스트루더용 TMC2209 드라이버 설정
uart_pin: PD8
run_current: 0.65
hold_current: 0.2
interpolate: True
stealthchop_threshold: 0

# ########=============================== 센서 설정 ===============================########

[verify_heater extruder]  # 익스트루더 히터의 온도 안정성 확인
max_error: 400               # 최대 허용 온도 차이
check_gain_time: 90          # 체크 주기
hysteresis: 50               # 온도 안정 구간
heating_gain: 1              # 온도 상승 비율

[verify_heater heater_bed]  # 베드 히터의 온도 안정성 확인
max_error: 30
check_gain_time: 150
hysteresis: 20
heating_gain: 1

[filament_motion_sensor encoder_sensor]  # 필라멘트 감지용 엔코더 센서 설정
switch_pin: ^!PC2               # 센서 스위치 핀, 풀업+역논리
detection_length: 5             # 감지 거리(mm)
extruder: extruder              # 감지 대상 익스트루더
pause_on_runout: true          # 감지 실패 시 일시정지
runout_gcode: 
    RESPOND MSG="Filament not extruded"

#[filament_switch_sensor extra_sensor]
#switch_pin: ^PB8
#pause_on_runout: True
#runout_gcode:

# ########============================== 입력 셰이핑 ==============================########

[input_shaper]
shaper_type_x = mzv
shaper_freq_x = 40.8
shaper_type_y = zv
shaper_freq_y = 64.6

