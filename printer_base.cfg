# ########=============================== 프린트 동작 =============================########

[gcode_macro START_PRINT]
gcode:
    G28
 SET_GCODE_VARIABLE MACRO=Z_OFFSET_TRACKER VARIABLE=initial_z_offset VALUE="{printer.gcode_move.homing_origin.z}"
# --- 헤드 장착 여부 검사 시작 ---
    {% if printer['filament_switch_sensor toolhead_sensor'].filament_detected %}
        # 헤드가 장착되어 있다면 (오류 상황)
        {action_raise_error("Park the TOOL-HEAD on the Tool station")}
        G90 ; 절대 좌표계 사용
        G1 X10 Y125 F40000 ; 지정된 위치로 이동
        CANCEL_PRINT ; 출력 취소
    {% else %}

# --- 스타트코드 ---    

   RESPOND MSG="START_PRINT received params: {params|string}"
   SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
   SET_GCODE_VARIABLE MACRO=TOOL_STATE VARIABLE=extrude_factor VALUE=1.0
    {% set target_BED = params.BED_TEMP|int %}
    {% set target_EXTRUDER = params.EXTRUDER_TEMP|int %}
    {% set target_TOOL = params.INITIAL_TOOL|default(0)|int %}
    
    RESET_FIRSTDOCK_FLAGS
    SET_GCODE_VARIABLE MACRO=TOOL_STATE VARIABLE=active_tool VALUE=-1

    M220 S100
    M117 Heating...
    M107
    M140 S{target_BED}
    M104 S220
    M117 Printing...
    HOME_CHECK
    BED_MESH_CALIBRATE #ADAPTIVE=1 ADAPTIVE_MARGIN=2
    SET_GCODE_VARIABLE MACRO=Z_OFFSET_TRACKER VARIABLE=initial_z_offset VALUE="{printer.gcode_move.homing_origin.z}"
    
    G21
    G90
    G1 Z1.5 F300
    G1 X10 Y125 F10000
    M83

    M104 S{target_EXTRUDER}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target_EXTRUDER - 5} MAXIMUM={target_EXTRUDER + 20}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={target_BED - 6} MAXIMUM={target_BED + 40}

    G1 X334 F9000
    CHANGE_TOOL NEXT_TOOL={target_TOOL} TEMP={target_EXTRUDER}
    G1 X334 F40000
    G1 E1.5 F2100

    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=toolhead_sensor ENABLE=0
   
  {% endif %}
  
[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
  {% if "xyz" in printer.toolhead.homed_axes %}

  {% set st = printer["gcode_macro TOOL_STATE"] %}
  {% if st.active_tool|int != -1 and not printer.pause_resume.is_paused %}
    # 활성화된 툴이 있을 경우에만 파킹 매크로를 실행합니다.
    PARK_CURRENT
  {% endif %}

  {% set z_pos = printer.toolhead.position.z %}
  {% set z_max = printer.configfile.config["stepper_z"]["position_max"] | float %}
  {% set z_target = z_pos + 100 %}
  {% if z_target > z_max %}{% set z_target = z_max %}{% endif %}

  SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
  M104 S0            # 익스트루더 히터 끄기
  M140 S0            # 베드 히터 끄기
  M106 S0            # 팬 끄기 (M106은 일반 팬 제어)
  M107     
  G91
  G1 Z0.3 F1000
  G90
  G1 X10 Y125 F30000
  G1 Z{z_target} F1800
  M117 CANCELLED

  SET_GCODE_VARIABLE MACRO=TOOL_STATE VARIABLE=active_tool VALUE=-1
  SET_GCODE_VARIABLE MACRO=TOOL_STATE VARIABLE=extrude_factor VALUE=1.0
  M84
  BASE_CANCEL_PRINT

  {% if printer.gcode_move.homing_origin.z != printer["gcode_macro Z_OFFSET_TRACKER"].initial_z_offset %}
  Z_OFFSET_APPLY_PROBE
  SAVE_CONFIG
  {% endif %}
  {% endif %}

[gcode_macro END_PRINT]
gcode:
   PARK_CURRENT
    {% set z_pos = printer.toolhead.position.z %}  # 현재 Z축 위치를 가져와 변수 z_pos에 저장
    {% set z_max = printer.configfile.config["stepper_z"]["position_max"] | float %}  # 설정 파일에서 Z축 최대 이동 범위를 가져옴
    {% set z_target = z_pos + 100 %}  # 현재 위치에서 Z축을 20mm 위로 이동하도록 목표 위치 계산
    {% if z_target > z_max %}
        {% set z_target = z_max - 5 %}  # 목표 위치가 Z 최대값을 넘으면 최대값 -5
    {% endif %}

    M117 COMPLETED             # LCD에 "출력 완료" 메시지 표시
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    M104 S0            # 익스트루더 히터 끄기
    M140 S0            # 베드 히터 끄기
    M106 S0            # 팬 끄기 (M106은 일반 팬 제어)
    M107               # 파트 팬 끄기 (추가적으로 안전을 위해)
    G91
    G1 Z0.3 F1000
    G90               # 절대 좌표 모드 설정
    G4 P5000            
    G1 X10 Y125 F30000       # X축을 원점(0)으로 빠르게 이동
    G1 Z{z_target} F1800  # 계산된 목표 위치로 Z축 상승 (속도 1000mm/min)
    SET_GCODE_VARIABLE MACRO=TOOL_STATE VARIABLE=active_tool VALUE=-1
    SET_GCODE_VARIABLE MACRO=TOOL_STATE VARIABLE=extrude_factor VALUE=1.0
    M84
    
  {% if printer.gcode_move.homing_origin.z != printer["gcode_macro Z_OFFSET_TRACKER"].initial_z_offset %}
  Z_OFFSET_APPLY_PROBE
  SAVE_CONFIG
  {% endif %}

[gcode_macro Z_OFFSET_TRACKER]
variable_initial_z_offset: 0.0
gcode:
