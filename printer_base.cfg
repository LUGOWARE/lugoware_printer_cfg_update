# ########============================== 매크로 / 기능 ===========================########

[board_pins]  # 보드의 확장 포트 설정 (EXP 헤더)
aliases:
    EXP1_1=PE7, EXP1_2=PG1,
    EXP1_3=PG0, EXP1_4=PF15,
    EXP1_5=PF14, EXP1_6=PF13,
    EXP1_7=PF12, EXP1_8=PF11,
    EXP1_9=<GND>, EXP1_10=<5V>,

    EXP2_1=PE13, EXP2_2=PE12,
    EXP2_3=PE15, EXP2_4=PE11,
    EXP2_5=PE10, EXP2_6=PE14,
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=<NC>

[display_status]  # 디스플레이 상태 출력용

[exclude_object]  # 오브젝트 단위 취소 기능

[gcode_arcs]  # 원형 호 지원
resolution: 1.0

[delayed_gcode clear_display]  # LCD 메시지 지우기용 지연 명령
gcode:
  M117

[respond]  # RESPOND 명령을 사용할 수 있도록 설정
default_type: echo  # 기본 응답 타입 설정

[force_move]  # 강제 위치 이동 허용 설정
enable_force_move: True

[gcode_macro HOME_CHECK]  
gcode:
  {% if "z" not in printer.toolhead.homed_axes %}
  G28
  {% elif "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
  G28 X Y
  {% endif %}

[gcode_macro LOAD_FILAMENT]  # 필라멘트 로드 매크로
description: "Load filament"
gcode:
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0  # 센서 비활성화 (오작동 방지)

    RESPOND MSG="Filament is loading..."
    M117 Loading filament...

    {% if 'TARGET_EXTRUDER' in params %}
      {% set target_extruder = params.TARGET_EXTRUDER | int %}
    {% else %}
      {% set target_extruder = 220 %}
    {% endif %}

    M104 S{target_extruder}  # 온도 설정
    M109 S{target_extruder}  # 대기
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={target_extruder - 3} MAXIMUM={target_extruder + 3}

    M83
    G1 E40 F300

    M117 Complete loading

[gcode_macro UNLOAD_FILAMENT]  # 필라멘트 언로드 매크로
description: "Unload filament"
variable_target_extruder: 220  # 기본 온도 설정
gcode:
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0  # 센서 비활성화

    RESPOND MSG="Filament unloading..."
    M117 Unloading filament...

    M104 S{target_extruder}  # 예열
    M109 R{target_extruder}  # 온도 도달 대기

    M83
    G1 E5 F200
    G1 E-40 F1000

    M117 Complete unloading

[gcode_macro TOOL_TEST_STATS]
variable_t0_fail: 0
variable_t1_fail: 0
variable_t2_fail: 0
variable_t3_fail: 0
variable_total_cycles: 0
gcode:
    # 변수 초기화용 매크로
    SET_GCODE_VARIABLE MACRO=TOOL_TEST_STATS VARIABLE=t0_fail VALUE=0
    SET_GCODE_VARIABLE MACRO=TOOL_TEST_STATS VARIABLE=t1_fail VALUE=0
    SET_GCODE_VARIABLE MACRO=TOOL_TEST_STATS VARIABLE=t2_fail VALUE=0
    SET_GCODE_VARIABLE MACRO=TOOL_TEST_STATS VARIABLE=t3_fail VALUE=0
    SET_GCODE_VARIABLE MACRO=TOOL_TEST_STATS VARIABLE=total_cycles VALUE=0
    RESPOND MSG="Statistics Reset."
    
[gcode_macro DOCK_PARK_TEST_x1]
gcode:
    {% set y_bases = [240, 170, 100, 30] %}

    {% for y in y_bases %}
        {% set tool_idx = loop.index0 %}
        RESPOND MSG="T{tool_idx} TESTING..."

        # --- [DOCK ACTION] ---
        G90
        G1 X334 Y{y + 0.5} F40000
        G1 X367 F5000
        G1 Y{y - 1.5} F800
        G1 X370 F800
	    G1 Y{y + 3.5} F800
     	G1 X373 F800
   	    G1 X374.5 Y{y - 2.2} E-1 F800
    	G1 E0.8 F500
    	G1 X374.2 F2000
        
        G1 Y{y + 5} F5000
        G1 Y{y} F5000
        G1 Y{y + 6.5} F5000
        
        G1 X355 F5000
    	G1 X365 F5000
    	G1 X355 F5000
     	G1 X365 F5000
    	G1 X355 F5000
        
    	G1 Y{y + 9} F6000 
     	G1 X371 F5000
     	G1 X359 F5000
    	G1 X371 F5000
    	G1 X359 F5000
     	G1 X371 F5000
     	G1 X359 F5000
    	G1 X371 F5000
    	G1 X364 F5000
    	G1 X330 F5000

        # --- 장착 확인 ---
        M400 
        CHECK_TOOL_STATE STATE=ATTACHED TOOL_NUM={tool_idx}
        
        # 일시정지 상태라면 강제로 풀어줌
        {% if printer.pause_resume.is_paused %}
            RESUME
        {% endif %}

        # ★ 중요: 여기서 매크로를 새로 호출해야 실시간 센서 상태를 읽습니다.
        _CHECK_AND_COUNT TOOL_IDX={tool_idx} Y_VAL={y}
    {% endfor %}

[gcode_macro _CHECK_AND_COUNT]
gcode:
    {% set t = params.TOOL_IDX|int %}
    {% set y = params.Y_VAL|float %}
    
    {% if not printer["filament_switch_sensor toolhead_sensor"].filament_detected %}
        # --- 실패 카운트 호출 ---
        _ADD_FAIL_COUNT TOOL={t}
        RESPOND TYPE=error MSG="T{t} DOCK FAILED! (Sensor not pressed)"

        # --- 복구 로직 ---
        CLEAR_PAUSE
        {% if printer.pause_resume.is_paused %}
            RESUME
        {% endif %}

        G90
        G1 X334 Y{y + 9} F50000
        G1 X359 F40000
        G1 Y{y + 3} F5000
        G1 X369 Y{y + 8} F5000
        G1 X374.5 F5000
        G1 Y{y} F4000
        G1 Y{y - 2.2} F1000
        G1 X366 F3000
        G1 X334 F10000
        M400
        RESPOND MSG="T{t} Recovery finished."
    {% else %}
        # 성공 로직 (기존과 동일)
        G1 X334 Y{y + 9} F50000
        G1 X359 F40000
        G1 Y{y + 3} F5000
        G1 X369 Y{y + 8} F5000
        G1 X374.5 F5000
        G1 Y{y} F4000
        G1 Y{y - 2.2} F1000
        G1 X366 F3000
        G1 X334 F10000
        RESPOND MSG="T{t} OK."
    {% endif %}

[gcode_macro _PRINT_TEST_RESULTS]
gcode:
    {% set s = printer["gcode_macro TOOL_TEST_STATS"] %}
    RESPOND TYPE=error MSG="TEST COMPLETED (Total 200 Swaps)"
    RESPOND MSG="FAIL COUNT -> T0:{s.t0_fail}, T1:{s.t1_fail}, T2:{s.t2_fail}, T3:{s.t3_fail}"

[gcode_macro DOCK_PARK_TEST_x50]
gcode:
    TOOL_TEST_STATS # 초기화
    HOME_CHECK      # 시작 전 딱 한 번 홈 잡기
    
    {% for iteration in range(50) %}
        RESPOND MSG=">>>> CYCLE {iteration + 1} / 50 STARTING <<<<"
        DOCK_PARK_TEST_x1
        M400
    {% endfor %}
    
    # 중요: 루프가 끝난 뒤 별도 매크로를 호출해야 '갱신된 변수값'을 읽어옵니다.
    _PRINT_TEST_RESULTS
    
[gcode_macro _ADD_FAIL_COUNT]
gcode:
    {% set t = params.TOOL|int %}
    {% set s = printer["gcode_macro TOOL_TEST_STATS"] %}
    
    {% if t == 0 %} SET_GCODE_VARIABLE MACRO=TOOL_TEST_STATS VARIABLE=t0_fail VALUE={s.t0_fail + 1}
    {% elif t == 1 %} SET_GCODE_VARIABLE MACRO=TOOL_TEST_STATS VARIABLE=t1_fail VALUE={s.t1_fail + 1}
    {% elif t == 2 %} SET_GCODE_VARIABLE MACRO=TOOL_TEST_STATS VARIABLE=t2_fail VALUE={s.t2_fail + 1}
    {% elif t == 3 %} SET_GCODE_VARIABLE MACRO=TOOL_TEST_STATS VARIABLE=t3_fail VALUE={s.t3_fail + 1}
    {% endif %}

# ########============================= 주요 동작 수행 =============================########

[gcode_macro PRINT_STATE]
variable_is_paused: False
variable_extruder_target: 0.0  # PAUSE 시 저장할 노즐 타겟 온도
gcode:

[pause_resume]  # 내장 PAUSE/RESUME 기능 래핑용
recover_velocity: 800
    
[gcode_macro TOOLHEAD_SENSE_PAUSE]
gcode:
    # 1. 현재 좌표 저장
    {% set last_x = printer.toolhead.position.x %}
    {% set last_y = printer.toolhead.position.y %}
    {% set last_z = printer.toolhead.position.z %}
    
    # 2. 전역 변수에 위치 기록 (나중에 RESUME할 때 사용)
    SET_GCODE_VARIABLE MACRO=CHANGE_TOOL_STATE VARIABLE=last_x VALUE={last_x}
    SET_GCODE_VARIABLE MACRO=CHANGE_TOOL_STATE VARIABLE=last_y VALUE={last_y}
    SET_GCODE_VARIABLE MACRO=CHANGE_TOOL_STATE VARIABLE=last_z VALUE={last_z}

    PAUSE_ACTION_A1
    
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # 1. 노즐 타겟 온도 저장 및 히터 즉시 끄기
    {% set extruder_target = printer.extruder.target|float %}
    SET_GCODE_VARIABLE MACRO=PRINT_STATE VARIABLE=extruder_target VALUE={extruder_target}
    M104 S0
    {action_respond_info("Extruder turned off immediately on PAUSE.")}

    # 2. 현재 상태 변수 및 물리 센서 상태 로드
    {% set st = printer["gcode_macro TOOL_STATE"] %}
    {% set dt = st.active_tool|int %}           # 장착된 툴 번호 (0~3), 없으면 -1
    {% set sensor_detected = printer['filament_switch_sensor toolhead_sensor'].filament_detected %} # PC3 센서 상태

    # 3. 팬 상태 저장 및 끄기
    {% set fan_speed = (printer.fan.speed * 255)|int %}
    SET_GCODE_VARIABLE MACRO=TOOL_STATE VARIABLE=fan_speed VALUE={fan_speed}
    M106 S0

    # 4. 현재 좌표 저장 (복구용)
    {% set last_x = printer.toolhead.position.x %}
    {% set last_y = printer.toolhead.position.y %}
    {% set last_z = printer.toolhead.position.z %}
    
    SET_GCODE_VARIABLE MACRO=CHANGE_TOOL_STATE VARIABLE=last_x VALUE={last_x}
    SET_GCODE_VARIABLE MACRO=CHANGE_TOOL_STATE VARIABLE=last_y VALUE={last_y}
    SET_GCODE_VARIABLE MACRO=CHANGE_TOOL_STATE VARIABLE=last_z VALUE={last_z}

    SAVE_GCODE_STATE NAME=STATE_TOOL_CHANGE

    # 5. 일시정지 실행 및 안전 위치 이동
    BASE_PAUSE
    M400    
    G90
    G1 Z{last_z + 5} F2000  # Z축 5mm 들어올리기

    # 6. 툴 장착 유무에 따른 액션 분기 (물리 센서 최우선)
    {% if not sensor_detected %}
        # [상황 1] 센서에 아무것도 감지되지 않음 -> 헤드가 비어있음
        M117 Toolhead Empty - PAUSE A1
        PAUSE_ACTION_A1
        SET_GCODE_VARIABLE MACRO=TOOL_STATE VARIABLE=idle_paused VALUE=1
        
    {% else %}
        # [상황 2] 센서에 툴이 감지됨 -> 장착된 번호(dt)에 따라 파킹
        {% if dt == 0 %} 
            PAUSE_ACTION_T0
        {% elif dt == 1 %} 
            PAUSE_ACTION_T1
        {% elif dt == 2 %} 
            PAUSE_ACTION_T2
        {% elif dt == 3 %} 
            PAUSE_ACTION_T3
        {% else %}
            # 센서는 감지되는데 변수가 -1이거나 알 수 없는 경우 (안전 모드)
            M117 Tool Detected but No Index - PAUSE A1
            PAUSE_ACTION_A1
        {% endif %}
    {% endif %}

# ########============================= 툴별 PAUSE 액션 ==========================########

[gcode_macro PAUSE_ACTION_T0]
gcode:  
    M117 T0 PAUSED
    PARK_TOOL_0
    G1 X0 F40000
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    M400
    SET_GCODE_VARIABLE MACRO=TOOL_STATE VARIABLE=active_tool VALUE=0

[gcode_macro PAUSE_ACTION_T1]
gcode:

    M117 T1 PAUSED
    PARK_TOOL_1
    G1 X0 F40000
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    M400
    SET_GCODE_VARIABLE MACRO=TOOL_STATE VARIABLE=active_tool VALUE=1

[gcode_macro PAUSE_ACTION_T2]
gcode: 
    M117 T2 PAUSED
    PARK_TOOL_2
    G1 X0 F40000
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    M400
    SET_GCODE_VARIABLE MACRO=TOOL_STATE VARIABLE=active_tool VALUE=2

[gcode_macro PAUSE_ACTION_T3]
gcode: 
    M117 T3 PAUSED
    PARK_TOOL_3
    G1 X0 F40000
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    M400
    SET_GCODE_VARIABLE MACRO=TOOL_STATE VARIABLE=active_tool VALUE=3

[gcode_macro PAUSE_ACTION_A1]
gcode: 
    M117 PAUSED
    G1 X0 F40000
    SET_GCODE_VARIABLE MACRO=TOOL_STATE VARIABLE=active_tool VALUE=-1 
    
# ########============================ 툴별 RESUME 액션 ==========================########

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:

  {% if printer.print_stats.state != "paused" %}
      RESPOND TYPE=error MSG="RESUME ignored: not paused"
      {% endif %}

  BASE_RESUME MOVE=0

  M117 RESUME PRINTING...
  RESPOND MSG="Start resume process..."

  G28 X Y
  {% set cts = printer["gcode_macro CHANGE_TOOL_STATE"] %}
  G1 Z{cts.last_z + 5} F3000
  
  {% set st = printer["gcode_macro TOOL_STATE"] %}
  {% set dt = (st.active_tool|default(-1))|int %}
  {% set saved_temp = printer["gcode_macro PRINT_STATE"].extruder_target|default(0)|float %}

  {% if dt >= 0 %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    {% if saved_temp > 0 %}
      M104 S{saved_temp}
      TEMPERATURE_WAIT SENSOR=extruder MINIMUM={saved_temp - 2} MAXIMUM={saved_temp + 2}
    {% endif %}
  {% endif %}

  {% if dt == 0 %} RESUME_ACTION_T0 TEMP={saved_temp|int} PRIME=0
  {% elif dt == 1 %} RESUME_ACTION_T1 TEMP={saved_temp|int} PRIME=0
  {% elif dt == 2 %} RESUME_ACTION_T2 TEMP={saved_temp|int} PRIME=0
  {% elif dt == 3 %} RESUME_ACTION_T3 TEMP={saved_temp|int} PRIME=0
  {% endif %}

  {% set cts = printer["gcode_macro CHANGE_TOOL_STATE"] %}
  G1 X{cts.last_x} Y{cts.last_y} F60000
  G1 Z{cts.last_z} F2000

  {% set fan_speed = printer["gcode_macro TOOL_STATE"].fan_speed|default(0)|int %}
  M106 S{fan_speed}

  M117 PRINTING...
  
[gcode_macro RESUME_ACTION_T0]
gcode:
    DOCK_TOOL_0 EXTRUDER_TEMP={params.TEMP|int} FIRST_USE=1

[gcode_macro RESUME_ACTION_T1]
gcode:
    DOCK_TOOL_1 EXTRUDER_TEMP={params.TEMP|int} FIRST_USE=1

[gcode_macro RESUME_ACTION_T2]
gcode:
    DOCK_TOOL_2 EXTRUDER_TEMP={params.TEMP|int} FIRST_USE=1

[gcode_macro RESUME_ACTION_T3]
gcode:
    DOCK_TOOL_3 EXTRUDER_TEMP={params.TEMP|int} FIRST_USE=1

