# ########============================== 히터 및 팬 ==============================########

[heater_bed]  # 히팅 베드 설정
heater_pin: PA5                    # 히터 연결 핀
sensor_pin: PA0                    # 센서 연결 핀
sensor_type: NTC 100K MGB18-104F39050L32  # 센서 타입
max_power: 1.0                    # 최대 전력
control: pid                      # PID 제어 방식 사용
pid_kp = 62.067
pid_ki = 0.879
pid_kd = 1096.254
min_temp: 0                       # 최소 작동 온도
max_temp: 115                     # 최대 작동 온도

[fan]  # 날개 팬 (FAN0)
pin: PA4

[heater_fan Hotend_fan]  # 핫엔드 팬, 보드 팬, 필터 팬
pin: PA3
fan_speed: 1
shutdown_speed: 1

[fan_generic chamber_fan]
pin: CB2:gpiochip0/gpio19
max_power: 1.0
kick_start_time: 0.5
shutdown_speed: 0

[delayed_gcode chamber_fan_auto_on]
initial_duration: 1.0
gcode:
    SET_FAN_SPEED FAN=chamber_fan SPEED=1.0

[delayed_gcode turn_off_extruder]
initial_duration: 600  # 10분
gcode:
    {% set state = printer.print_stats.state|default("") %}
    {% set target = printer.extruder.target|default(0) %}
    {% if target > 0 and state != "printing" %}
        M104 S0
        {action_respond_info("Extruder turned off after 10 minutes idle (state=" ~ state ~ ").")}
    {% else %}
        {action_respond_info("skip extruder-off (state=" ~ state ~ ", target=" ~ target ~ ")")}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=turn_off_extruder DURATION=600

[delayed_gcode turn_off_bed]
initial_duration: 3600  # 기본 1시간
gcode:
    {% set state = printer.print_stats.state|default("") %}
    {% set target = printer.heater_bed.target|default(0) %}

    {% if target > 0 %}
        {% if state == "paused" %}
            {action_respond_info("Bed heating paused - extend timeout to 48h.")}
            UPDATE_DELAYED_GCODE ID=turn_off_bed DURATION={48*3600}
        {% elif state == "printing" %}
            {action_respond_info("skip bed-off (still printing).")}
            UPDATE_DELAYED_GCODE ID=turn_off_bed DURATION=3600
        {% else %}
            M140 S0
            {action_respond_info("Bed turned off after 1h idle (state=" ~ state ~ ").")}
            UPDATE_DELAYED_GCODE ID=turn_off_bed DURATION=3600
        {% endif %}
    {% else %}
        {action_respond_info("skip bed-off (target=" ~ target ~ ").")}
        UPDATE_DELAYED_GCODE ID=turn_off_bed DURATION=3600
    {% endif %}

[idle_timeout]
timeout: 600
gcode:
    {% set state = printer.print_stats.state|default("") %}
    # 출력 중에는 무조건 유지
    {% if state == "printing" %}
        UPDATE_DELAYED_GCODE ID=turn_off_extruder DURATION=600
        UPDATE_DELAYED_GCODE ID=turn_off_bed DURATION=3600
    {% else %}
        # 출력 안 하는 경우에도 타이머만 갱신 (실제 on/off는 delayed_gcode 조건에서 처리)
        UPDATE_DELAYED_GCODE ID=turn_off_extruder DURATION=600
        UPDATE_DELAYED_GCODE ID=turn_off_bed DURATION=3600
    {% endif %}

# ########========================== 프로브 및 수평 보정 =========================########

[homing_override]
axes: z
set_position_z: 0
gcode:
  G90
  G0 Z5 F600      ; Z축을 5mm 위로 안전하게 이동
  G28 X Y         ; X, Y축 호밍
  G0 X22 Y115 F10000 ; 프로빙을 위해 베드 중앙으로 이동 (베드 크기에 맞게 좌표 수정)
  
  G28 Z0          ; Z축 호밍 (probe의 speed: 5 로 빠른 1차 측정)
  G1 Z5 F1000
  PROBE
  G1 Z5 F1000
    
[probe]  # Z 프로브 설정
pin: ^!PC13                  # 프로브 연결 핀
x_offset: -30.7            # X 오프셋
y_offset: 30.7           # Y 오프셋
#z_offset: 0                # Z 오프셋 (주석 처리됨)
speed: 5                   # 측정 속도
activate_gcode:
    Probe_Deploy
    G4 P500
deactivate_gcode:
    Probe_Stow

[output_pin probe_enable]
pin: PC15
value: 0

[gcode_macro Probe_Deploy]
gcode:
    SET_PIN PIN=probe_enable VALUE=1

[gcode_macro Probe_Stow]
gcode:
    SET_PIN PIN=probe_enable VALUE=0

[screws_tilt_adjust]  # 수평 조정을 위한 스크류 위치 설정
screw1: 67, 5
screw1_name: front left screw
screw2: 321, 5
screw2_name: front right screw
screw3: 321, 189
screw3_name: rear right screw
screw4: 67, 189
screw4_name: rear left screw
horizontal_move_z: 3  # 이동 시 Z 상승 높이
speed: 200            # 이동 속도
screw_thread: CW-M3   # 나사 규격

[bed_mesh]
speed: 200              # 프로브 이동 속도
horizontal_move_z: 1.5    # 프로빙할 때 헤드가 이동할 Z 높이
mesh_min: 0, 31            # 수정: 베드 시작점 (X: 32, Y: 2)
mesh_max: 304, 240         # 수정: 베드 끝점 (X: 304, Y: 240)
probe_count: 6,6       # 측정 포인트 개수 (X방향 5개, Y방향 5개)
algorithm: bicubic

# ########========================== 헤드 장착 유무 센서 =========================########

[delayed_gcode disable_toolhead_sensor_on_boot]
initial_duration: 1.0
gcode:
    SET_FILAMENT_SENSOR SENSOR=toolhead_sensor ENABLE=0
    {action_respond_info("Toolhead sensor disabled by default.")}
    
[filament_switch_sensor toolhead_sensor]
switch_pin: ^PC3
pause_on_runout: True
runout_gcode: 
    M117 Toolhead Sensor Triggered!
    TOOLHEAD_SENSE_PAUSE

[gcode_macro CHECK_TOOL_STATE]
description: Checks toolhead state against the required state (ATTACHED or DETACHED)
gcode:
    {% if not params.STATE %}
        {action_raise_error("CHECK_TOOL_STATE: STATE parameter is missing.")}
    
    # --- '헤드 장착' 상태를 검사해야 할 때 ---
    {% elif params.STATE|upper == 'ATTACHED' %}
        {% if not printer['filament_switch_sensor toolhead_sensor'].filament_detected %}
            {% set error_msg = "Tool-head is not in position." %}
            M117 {error_msg}
            RESPOND TYPE=error MSG="{error_msg}" 
            PAUSE
        {% endif %}

    # --- '헤드 미장착' 상태를 검사해야 할 때 ---
    {% elif params.STATE|upper == 'DETACHED' %}
        {% if printer['filament_switch_sensor toolhead_sensor'].filament_detected %}
            {% set error_msg = "Tool-head is not in position." %}
            M117 {error_msg}
            RESPOND TYPE=error MSG="{error_msg}"
            {action_raise_error(error_msg)}
        {% endif %}
    {% endif %}

# ########============================= 툴 체인지 동작 ===========================########

[gcode_macro TOOL_STATE]
variable_active_tool: -1               # 현재 툴 번호
variable_extrude_factor: 1.0           # 기본값 1.0 (1.75mm 기준)
variable_extrude_retract_length: 1.2   # 일반 리트랙션 (기본값)
variable_toolchange_retract: 1.65      # 소재 교체용 리트랙션 (기본값)
variable_is_parked: 0                  # 0=미파킹, 1=파킹됨 (전역)
variable_parked_tool: -1               # 마지막으로 파킹한 툴 번호(로그/디버깅용)
variable_changing: 0    
variable_fan_speed: 0
variable_idle_paused: 0
variable_additional_prime: 0
gcode:

[gcode_macro CHANGE_TOOL_STATE]
variable_last_x: 0
variable_last_y: 0
variable_last_z: 0
gcode:

[gcode_macro CHANGE_TOOL]
gcode:
    {% set h_d = params.H_D|default(0)|float %}
    {% set a_p = params.A_P|default(0)|float %}
    SET_GCODE_VARIABLE MACRO=TOOL_STATE VARIABLE=additional_prime VALUE={a_p}

    {% set st = printer["gcode_macro TOOL_STATE"] %}

    {% set next_tool = params.NEXT_TOOL|int %}
    {% set temp = params.TEMP|int %}
    {% set r_len = params.RETRACT_LEN|default(1.2)|float %}
    {% set tc_r_len = params.TC_RETRACT_LEN|default(1.65)|float %}
    SET_GCODE_VARIABLE MACRO=TOOL_STATE VARIABLE=extrude_retract_length VALUE={r_len}
    SET_GCODE_VARIABLE MACRO=TOOL_STATE VARIABLE=toolchange_retract VALUE={tc_r_len}
     
    {% if st.active_tool|int != next_tool %}
        {% set dia = params.FILAMENT_DIAMETER|default(1.75)|float %}
        {% set factor = ((1.75 / dia) ** 2)|round(4) %}
        SET_GCODE_VARIABLE MACRO=TOOL_STATE VARIABLE=extrude_factor VALUE={factor}

        M204 S10000

        # 출력 끝난 위치 저장
        {% set last_x = printer.toolhead.position.x %}
        {% set last_y = printer.toolhead.position.y %}
        {% set last_z = printer.toolhead.position.z %}
        
        SET_GCODE_VARIABLE MACRO=CHANGE_TOOL_STATE VARIABLE=last_x VALUE={last_x}
        SET_GCODE_VARIABLE MACRO=CHANGE_TOOL_STATE VARIABLE=last_y VALUE={last_y}
        SET_GCODE_VARIABLE MACRO=CHANGE_TOOL_STATE VARIABLE=last_z VALUE={last_z}

        # PARK 동작 실행
        G90
        G1 Z{last_z + 0.4} F3000
        G1 X334 Z{last_z + 5} F40000
        PARK_CURRENT NEXT_TEMP={temp}

        # DOCK 실행 (first_use 플래그 전달)
        {% set fds = printer["gcode_macro FIRSTDOCK_STATE"] %}
        {% set already_used = 0 %}
        {% if next_tool == 0 %}{% set already_used = fds.used_0|int %}
        {% elif next_tool == 1 %}{% set already_used = fds.used_1|int %}
        {% elif next_tool == 2 %}{% set already_used = fds.used_2|int %}
        {% elif next_tool == 3 %}{% set already_used = fds.used_3|int %}
        {% endif %}
        {% set first_use = 1 if already_used == 0 else 0 %}

        {% if next_tool == 0 %} DOCK_TOOL_0 EXTRUDER_TEMP={temp} FIRST_USE={first_use}
        {% elif next_tool == 1 %} DOCK_TOOL_1 EXTRUDER_TEMP={temp} FIRST_USE={first_use}
        {% elif next_tool == 2 %} DOCK_TOOL_2 EXTRUDER_TEMP={temp} FIRST_USE={first_use}
        {% elif next_tool == 3 %} DOCK_TOOL_3 EXTRUDER_TEMP={temp} FIRST_USE={first_use}
        {% endif %}
        {% if first_use == 1 %}
            SET_GCODE_VARIABLE MACRO=FIRSTDOCK_STATE VARIABLE=used_{next_tool} VALUE=1
        {% endif %}

        M221 S100
        SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
        
    {% endif %}

[gcode_macro CHECK_ACTIVE_TOOL]
gcode:
    {% set tool_num = printer["gcode_macro TOOL_STATE"].active_tool %}
    RESPOND MSG="Current active_tool is: {tool_num}"

[gcode_macro FIRSTDOCK_STATE]
variable_used_0: 0
variable_used_1: 0
variable_used_2: 0
variable_used_3: 0

gcode:
    RESPOND PREFIX=FIRSTDOCK_STATE MSG="Usage flags 
    T0={printer['gcode_macro FIRSTDOCK_STATE'].used_0} 
    T1={printer['gcode_macro FIRSTDOCK_STATE'].used_1} 
    T2={printer['gcode_macro FIRSTDOCK_STATE'].used_2} 
    T3={printer['gcode_macro FIRSTDOCK_STATE'].used_3}"
      
[gcode_macro RESET_FIRSTDOCK_FLAGS]
gcode:
    SET_GCODE_VARIABLE MACRO=FIRSTDOCK_STATE VARIABLE=used_0 VALUE=0
    SET_GCODE_VARIABLE MACRO=FIRSTDOCK_STATE VARIABLE=used_1 VALUE=0
    SET_GCODE_VARIABLE MACRO=FIRSTDOCK_STATE VARIABLE=used_2 VALUE=0
    SET_GCODE_VARIABLE MACRO=FIRSTDOCK_STATE VARIABLE=used_3 VALUE=0

# ########=============================== 도킹 / 파킹 ============================########

[gcode_macro DOCK_TOOL_0]
gcode:
    {% set default_h_d = 10 %}
    {% set h_d = params.H_D|default(0)|float %}
    {% if h_d == 0 %}
    {% set h_d = default_h_d %}
    {% endif %}
    {% set first_use = params.FIRST_USE|default(0)|int %}
    {% if first_use == 1 %}
    {% set h_d = h_d * 2 %}
    {% endif %}
