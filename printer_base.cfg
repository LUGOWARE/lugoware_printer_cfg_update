[gcode_macro PARK_CURRENT]
gcode:
  {% set next_temp = params.NEXT_TEMP|default(0)|int %}
  {% set st = printer["gcode_macro TOOL_STATE"] %}
  
  {% if st.active_tool|int != -1 %}
    {% set t = st.active_tool|int %} # 현재 장착된 툴 번호 가져오기
    
    SAVE_GCODE_STATE NAME=S_PARK_CUR
    
    # 해당 툴의 파킹 매크로 호출
    {% if   t == 0 %} PARK_TOOL_0 NEXT_TEMP={next_temp}
    {% elif t == 1 %} PARK_TOOL_1 NEXT_TEMP={next_temp}
    {% elif t == 2 %} PARK_TOOL_2 NEXT_TEMP={next_temp}
    {% elif t == 3 %} PARK_TOOL_3 NEXT_TEMP={next_temp}
    {% endif %}
    
    RESTORE_GCODE_STATE NAME=S_PARK_CUR
    
  {% else %}
    {action_respond_info("Park skipped: No tool on head")}
  {% endif %}

