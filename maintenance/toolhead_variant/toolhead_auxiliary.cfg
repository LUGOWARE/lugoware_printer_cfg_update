# Detachable toolhead heater; .16 PID values are provisional on this printer.
[toolhead_temperature_test]
sensor_pin: PA2
pullup_resistor: 4700

[heater_generic Toolhead]
heater_pin: PB7
sensor_type: DetachableToolhead
control: pid
pid_kp: 34.320
pid_ki: 5.720
pid_kd: 51.480
min_temp: 0
max_temp: 300
min_extrude_temp: 0
max_power: 1.0
