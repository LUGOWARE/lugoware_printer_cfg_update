# Detachable toolhead heater; release PID measured on .107.
[toolhead_temperature_test]
sensor_pin: PA2
pullup_resistor: 4700

[heater_generic Toolhead]
heater_pin: PB7
sensor_type: DetachableToolhead
control: pid
pid_kp: 37.681
pid_ki: 9.191
pid_kd: 38.623
min_temp: 0
max_temp: 300
min_extrude_temp: 0
max_power: 1.0
