# Detachable toolhead heater; release PID measured on .107.
[toolhead_auxiliary]
sensor_pin: PA2  # 보조 툴헤드 온도센서 입력 핀 / Auxiliary toolhead temperature sensor input pin
pullup_resistor: 4700  # 센서 풀업 저항(Ω) / Sensor pull-up resistance (ohms)
sync_manual_preheat: False  # 대기 중 수동 예열 연동 여부, 출력에는 적용 안 됨 / Link idle manual preheat only
prime_temperature_margin: 15  # 프라임 시작까지 허용하는 슬라이서 목표 온도와의 차이(°C) / Degrees below the slicer target allowed at prime start
prime_timeout: 60  # 도킹 후 프라임까지 최대 대기 시간(초) / Maximum wait after docking before priming (seconds)
park_nozzle_preheat_offset: 5  # 파킹 중 다음 소재 목표보다 높일 노즐 온도(°C) / Nozzle degrees above the next material target during parking

[heater_generic Toolhead]
heater_pin: PB7
sensor_type: DetachableToolhead
control: pid
pid_kp: 37.681
pid_ki: 9.191
pid_kd: 38.623
min_temp: 0
max_temp: 300
min_extrude_temp: 0
max_power: 1.0

[gcode_macro TOOLHEAD_IDLE_STATE]
variable_last_target: 0.0
variable_idle_count: 0
gcode:

[delayed_gcode turn_off_toolhead]
initial_duration: 60
gcode:
    {% set state = printer.print_stats.state|default("") %}
    {% set target = printer["heater_generic Toolhead"].target|float %}
    {% set st = printer["gcode_macro TOOLHEAD_IDLE_STATE"] %}
    {% set cnt = st.idle_count|int %}
    {% if target != st.last_target|float %}
        {% set cnt = 0 %}
    {% elif target > 0 and state != "printing" %}
        {% set cnt = cnt + 1 %}
    {% else %}
        {% set cnt = 0 %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=TOOLHEAD_IDLE_STATE VARIABLE=last_target VALUE={target}
    {% if cnt >= 10 %}
        SET_HEATER_TEMPERATURE HEATER=Toolhead TARGET=0
        {action_respond_info("Toolhead heater turned off after 10 minutes idle.")}
        SET_GCODE_VARIABLE MACRO=TOOLHEAD_IDLE_STATE VARIABLE=idle_count VALUE=0
    {% else %}
        SET_GCODE_VARIABLE MACRO=TOOLHEAD_IDLE_STATE VARIABLE=idle_count VALUE={cnt}
    {% endif %}
    UPDATE_DELAYED_GCODE ID=turn_off_toolhead DURATION=60
