[extruder]
step_pin = PA10
dir_pin = !PA14
enable_pin = !PA13
microsteps = 16
rotation_distance = 7
gear_ratio = 1:1
full_steps_per_rotation = 200
nozzle_diameter = 0.400
filament_diameter = 1.750
min_temp = -10
max_temp = 350
min_extrude_temp = 0
heater_pin = multi_pin:dual_hotend_heater
sensor_type = pt1000_cal
sensor_pin = PA1
max_power = 1.0
control = pid
pid_kp = 24.053
pid_ki = 1.932
pid_kd = 74.864
pressure_advance = 0.05
pressure_advance_smooth_time = 0.045
max_extrude_cross_section = 50
instantaneous_corner_velocity = 1
max_extrude_only_distance = 500
max_extrude_only_velocity = 100
max_extrude_only_accel = 1500
step_pulse_duration = 0.000004

[heater_bed]
heater_pin = PA5
sensor_pin = PA0
sensor_type = NTC 100K MGB18-104F39050L32
max_power = 1.0
control = pid
pid_kp = 62.067
pid_ki = 0.879
pid_kd = 1096.254
min_temp = 0
max_temp = 115

