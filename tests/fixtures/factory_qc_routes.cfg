[gcode_macro PARK_0]
gcode =
	{% set old_accel = printer.toolhead.max_accel|float %}
	M204 S10000

	{% if params.FROM_PRIME|default(0)|int %}
	G1 X263.5 Y248.5 F10000
	G1 X264 F2000
	G1 X269.5 F3000
	G1 Y238 F3000
	G1 X258 F5000
	G1 X230 F10000
	G1 X22 Y115 F45000
	{% else %}
	RESPOND MSG="PARKING T1."
	HOME_CHECK
	{% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes or "z" not in printer.toolhead.homed_axes %}
	G1 Z20 F1000
	{% endif %}
	G1 X230 Y244 F45000
	G1 X246 Y248.5 F10000
	G1 X264 F2000
	G1 X269.5 F3000
	G1 Y238 F3000
	G1 X258 F5000
	G1 X230 F10000
	G1 X22 Y115 F45000
	{% endif %}

	M204 S{old_accel}

