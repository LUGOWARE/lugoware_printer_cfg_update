# ########============================== MCU 설정 ===============================########

[include mainsail.cfg]
[include timelapse.cfg]
[include printer_base.cfg]
[include printer_custom.cfg]
[lugo_tool_temperature]
[fast_cancel]
[print_sensor]
[exclude_tool_guard]
[include toolhead_auxiliary.cfg]
[lugo_recovery]
[lugo_preanalysis]

[probe_auto_recovery]
attempts: 2
minimum_clearance: 1.0

[mcu CB2]
serial: /tmp/klipper_host_mcu

[mcu]
serial: @MCU_SERIAL@

[virtual_sdcard]
path: @GCODE_PATH@

[screen_mesh]
path: @SCREEN_MESH_PATH@

[lugo_diagnostics]
model: M
xy_speed: 200
z_speed: 5
