# ########============================== 프린터 기능 설정 ==============================########

[main]
auto_open_extrude: False

[menu __main more limits]
enable: False

[menu __main more macros]
enable: False

[menu __main more pins]
enable: False

[menu __main more console]
enable: False

[menu __main more input_shaper]
enable: False

[menu __main more fine_tune]
enable: False

[menu __main more updater]
enable: False

[menu __main more camera]
enable: False

[menu __print pins]
enable: False

[menu __print camera]
enable: False

[menu __print lock]
enable: False

[menu __print temperature]
enable: True
panel: tool_temperature
name: {{ _('Tool temperature control') }}

[menu __main more print_status]
name: {{ _('Print Status') }}
icon: printer
panel: job_status

[menu __main prepare_preview]
name: {{ _('Prepare') }}
icon: extruder
panel: tool_prepare

# ########============================== Quick Preheat ==============================########

[preheat Bed : 60℃]
#extruder: 230
heater_bed: 60

[preheat Bed : 80℃]
#extruder: 230
heater_bed: 80

[preheat Bed : 100℃]
#extruder: 230
heater_bed: 100

[preheat Bed : 110℃]
#extruder: 230
heater_bed: 110

# ########============================== Heater Test ==============================########

[menu __main more heater_test]
name: {{ _('Nozzle heater test') }}
icon: extruder

[menu __main more heater_test auto_test]
name: {{ _('Automatic heater test') }}
icon: extruder
method: printer.gcode.script
params: {"script": "HEATER_TEST"}

[menu __main more heater_test heater_off]
name: {{ _('Stop heater test') }}
icon: cancel
method: printer.gcode.script
params: {"script": "HEATER_TEST_OFF"}
